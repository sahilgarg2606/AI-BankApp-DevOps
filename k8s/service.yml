kind: Service
apiVersion: v1
metadata:
    name: mysql-service
    namespace: bankapp-namespace
spec:
    selector:
        app: mysql
    ports:
      - port: 3306

---

kind: Service
apiVersion: v1
metadata:
    name: bankapp-service
    namespace: bankapp-namespace
spec:
    type: NodePort
    selector:
        app: bankapp
    ports:
      - port: 8080
        targetPort: 8080
        nodePort: 30007

