kind: Service
apiVersion: v1
metadata:
    name: mysql-service
    namespace: bankapp-namespace
spec:
    selector:
        app: mysql
    ports:
      - port: 3306

---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: bankapp-namespace
spec:
  selector:
    app: ollama
  ports:
    - port: 11434

---


kind: Service
apiVersion: v1
metadata:
    name: bankapp-service
    namespace: bankapp-namespace
spec:
    type: NodePort
    selector:
        app: bankapp
    ports:
      - port: 8080
        nodePort: 30080

